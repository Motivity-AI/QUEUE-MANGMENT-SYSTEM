server {
    listen 80;
    server_name queue.yourdomain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name queue.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/queue.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queue.yourdomain.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # مهم جداً لـ SSE (شاشة العرض والنداء اللحظي)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection '';
    }
}